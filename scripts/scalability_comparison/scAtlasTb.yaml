output_dir: data/pipeline/scalability/scAtlasTb
images: data/images/scalability
use_gpu: true

DATASETS:

  HLCA:
    input:
      preprocessing:
        HLCAv1: data/pipeline/load_data/download/HLCAv1_core.h5ad
    
    preprocessing:
      raw_counts: raw/X
      normalize:
        target_sum: 10_000
      highly_variable_genes:
        n_top_genes: 2000
        dask: true
      assemble:
        - normalize
        - highly_variable_genes
        - pca
        - neighbors
        - umap
