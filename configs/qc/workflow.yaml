DATASETS:

  prepare_data:
    input:
      relabel:
        HLCA: data/pipeline/load_data/download/HLCAv1_core.h5ad
      split_data: relabel
    
    relabel:
      rename_obsm_keys:
        X_scanvi_emb: X_emb
      new_columns:
        file: data/input/HLCA_unfiltered_anno.tsv
        index_col: index
        order:
          - index
          - "3'_or_5'"
          - cell_ranger_version
          - cell_viability_%
          - enrichment
          - ensembl_release_reference_genome
          - single_cell_platform
          - anatomical_region_coarse
          - anatomical_region_highest_res
          - Processing_site    

  HLCA_qc:
    input:
      doublets:
        Banovich_Kropski_2020: data/pipeline/qc/split_data/dataset~prepare_data/file_id~relabel:HLCA/key~study/value~Banovich_Kropski_2020.zarr
        Barbry_Leroy_2020: data/pipeline/qc/split_data/dataset~prepare_data/file_id~relabel:HLCA/key~study/value~Barbry_Leroy_2020.zarr
        Jain_Misharin_2021: data/pipeline/qc/split_data/dataset~prepare_data/file_id~relabel:HLCA/key~study/value~Jain_Misharin_2021.zarr
        Krasnow_2020: data/pipeline/qc/split_data/dataset~prepare_data/file_id~relabel:HLCA/key~study/value~Krasnow_2020.zarr
        Lafyatis_Rojas_2019: data/pipeline/qc/split_data/dataset~prepare_data/file_id~relabel:HLCA/key~study/value~Lafyatis_Rojas_2019.zarr
        Meyer_2019: data/pipeline/qc/split_data/dataset~prepare_data/file_id~relabel:HLCA/key~study/value~Meyer_2019.zarr
        Misharin_2021: data/pipeline/qc/split_data/dataset~prepare_data/file_id~relabel:HLCA/key~study/value~Misharin_2021.zarr
        Misharin_Budinger_2018: data/pipeline/qc/split_data/dataset~prepare_data/file_id~relabel:HLCA/key~study/value~Misharin_Budinger_2018.zarr
        Nawijn_2021: data/pipeline/qc/split_data/dataset~prepare_data/file_id~relabel:HLCA/key~study/value~Nawijn_2021.zarr
        Seibold_2020: data/pipeline/qc/split_data/dataset~prepare_data/file_id~relabel:HLCA/key~study/value~Seibold_2020.zarr
        Teichmann_Meyer_2019: data/pipeline/qc/split_data/dataset~prepare_data/file_id~relabel:HLCA/key~study/value~Teichmann_Meyer_2019.zarr
      split_data: doublets
      qc: split_data
      merge: qc
    
    split_data:
      key: ann_level_1
      values:
        - Immune
        - Epithelial
        - Endothelial
        - Stroma
        - Proliferating_cells
    
    qc:
      counts: raw/X
      hue:
        - ann_level_1
        - ann_level_2
        - ann_level_3
        - ann_finest_level
        - scanvi_label
        - assay
        - dataset
        - study
        - donor_id
        - subject_ID
        - sample
        - fresh_or_frozen
        - sex
        - lung_condition
        - reference_genome
        - sequencing_platform
        - smoking_status
        - subject_type
        - tissue_dissociation_protocol
        - scrublet_score
      scautoqc_metrics_params: configs/qc/scautoqc_params.tsv
      scautoqc_gaussian_kwargs:
        threshold: 0.1
      scautoqc_metrics:
        - n_counts
        - n_genes
        - percent_mito
      # thresholds_file: configs/hlca/qc_thresholds.tsv

    merge:
      merge_strategy: inner
      dask: true
      backed: true
      threads: 50


  HLCA_highQC:
    input:
      filter:
        highQC: data/pipeline/qc/merge/dataset~HLCA_qc.zarr
      preprocessing: filter
      integration: preprocessing
      metrics: integration
    
    filter:
      keep_by_column:
        qc_status:
          - passed


  HLCA_map_to_highQC:
    input:
      filter:
        lowQC: data/pipeline/qc/merge/dataset~HLCA_qc.zarr
      reference_mapping: filter
      merge:
        # low QC must go first, otherwise gets overwritten by high QC data
        lowQC: reference_mapping
        # must match the object of the model that is being used
        highQC: "data/pipeline/qc/integration/dataset~HLCA_highQC/file_id~preprocessing:filter:highQC\
          /batch~dataset/var_mask~highly_variable/method~scanvi--hyperparams~37055b39e0--label~scanvi_label--output_type~embed.zarr"
      relabel: merge

    filter:
      keep_by_column:
        qc_status:
          - failed
    
    reference_mapping:
      scarches:
        model: "data/pipeline/qc/integration/run_method/dataset~HLCA_highQC/file_id~preprocessing:filter:highQC\
          /batch~dataset/var_mask~highly_variable/method~scanvi--hyperparams~37055b39e0--label~scanvi_label/model"
        layer: X
        model_params:
          batch_key: dataset
        train_params:
          max_epochs: 50
      umap_colors:
        - file_id
        - ann_finest_level
        - assay
        - dataset
        - study
        - disease
        - lung_condition
        - percent_mito
        - n_counts
        - n_genes
        - scrublet_score
        - qc_status
    
    relabel:
      selective_update:
        base_column: ann_finest_level
        new_column: ann_finest_level
        update_map:
          file_id:
            'lowQC': # remove any annotations form low QC dataset

  benchmark:
    input:
      preprocessing:
        HLCA_map_to_highQC: data/pipeline/qc/relabel/dataset~HLCA_map_to_highQC/file_id~merge:HLCA_map_to_highQC.zarr
        HLCA: data/pipeline/qc/relabel/dataset~prepare_data/file_id~HLCA.zarr
      clustering: preprocessing
      label_transfer: clustering
      metrics: label_transfer
      collect: metrics
      marker_genes: collect

    clustering:
      recompute_umap: true
      recompute_neighbors: true

    label_transfer:
      majority_reference:
        reference_key: ann_finest_level
        query_key: leiden_0.5_3
        crosstab_kwargs:
          dropna: true

    collect:
      sep: --
      same_slots:
        - X
        - var
        - layers
      merge_slots:
        - obs
        - obsm
        - obsp
        - uns
      skip_slots:
        - raw

    marker_genes:
      sample: sample
      layer: layers/normcounts
      groups:
        - ann_finest_level--metrics:label_transfer:clustering:preprocessing:HLCA
        - majority_reference--metrics:label_transfer:clustering:preprocessing:HLCA
        - majority_reference--metrics:label_transfer:clustering:preprocessing:HLCA_map_to_highQC
        - leiden_0.5_2--metrics:label_transfer:clustering:preprocessing:HLCA
        - leiden_0.5_2--metrics:label_transfer:clustering:preprocessing:HLCA_map_to_highQC
      marker_genes: HLCA_immune, HLCA_epithelial, HLCA_endothelial, HLCA_stroma, HLCA_other
      rank_genes_groups:
        reference: rest
        method: wilcoxon
      plot:
        n_genes: 5
