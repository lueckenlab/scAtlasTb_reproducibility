DATASETS:

  HLCA_split_study:
    input:
      split_data:
        # HLCA: data/pipeline/load_data/download/HLCAv1_core.h5ad
        HLCA: data/input/HLCA_unfiltered.h5ad
    
    split_data:
      key: study
      values:
        - Banovich_Kropski_2020
        - Barbry_Leroy_2020
        - Jain_Misharin_2021
        - Krasnow_2020
        - Lafyatis_Rojas_2019
        - Meyer_2019
        - Misharin_2021
        - Misharin_Budinger_2018
        - Nawijn_2021
        - Seibold_2020
        - Teichmann_Meyer_2019
      dask: true
      backed: true
      threads: 50
      slots:
        X: layers/counts # raw/X
        obs: obs
        var: var
        obsm: obsm
        obsp: obsp


  HLCA_qc:
    input:
      doublets:
        Banovich_Kropski_2020: data/pipeline/qc/split_data/dataset~HLCA_split_study/file_id~HLCA/key~study/value~Banovich_Kropski_2020.zarr
        Barbry_Leroy_2020: data/pipeline/qc/split_data/dataset~HLCA_split_study/file_id~HLCA/key~study/value~Barbry_Leroy_2020.zarr
        Jain_Misharin_2021: data/pipeline/qc/split_data/dataset~HLCA_split_study/file_id~HLCA/key~study/value~Jain_Misharin_2021.zarr
        Krasnow_2020: data/pipeline/qc/split_data/dataset~HLCA_split_study/file_id~HLCA/key~study/value~Krasnow_2020.zarr
        Lafyatis_Rojas_2019: data/pipeline/qc/split_data/dataset~HLCA_split_study/file_id~HLCA/key~study/value~Lafyatis_Rojas_2019.zarr
        Meyer_2019: data/pipeline/qc/split_data/dataset~HLCA_split_study/file_id~HLCA/key~study/value~Meyer_2019.zarr
        Misharin_2021: data/pipeline/qc/split_data/dataset~HLCA_split_study/file_id~HLCA/key~study/value~Misharin_2021.zarr
        Misharin_Budinger_2018: data/pipeline/qc/split_data/dataset~HLCA_split_study/file_id~HLCA/key~study/value~Misharin_Budinger_2018.zarr
        Nawijn_2021: data/pipeline/qc/split_data/dataset~HLCA_split_study/file_id~HLCA/key~study/value~Nawijn_2021.zarr
        Seibold_2020: data/pipeline/qc/split_data/dataset~HLCA_split_study/file_id~HLCA/key~study/value~Seibold_2020.zarr
        Teichmann_Meyer_2019: data/pipeline/qc/split_data/dataset~HLCA_split_study/file_id~HLCA/key~study/value~Teichmann_Meyer_2019.zarr
      split_data: doublets
      qc: split_data
      merge: qc

    doublets:
      counts: X
      batch: sample
      chunk_size: 20000
    
    split_data:
      dask: true
      backed: true
      key: original_ann_level_1 # ann_level_1
      values:
        - Immune
        - Epithelial
        - Endothelial
        - Stroma
        - Proliferating_cells
      slots:
        X: X
        obs: obs
        var: var
        obsm: obsm
        obsp: obsp
    
    qc:
      counts: X
      hue:
        - ann_level_1
        - ann_level_2
        - ann_level_3
        - original_ann_level_1
        - original_ann_level_2
        - original_ann_level_3
        - ann_finest_level
        - manual_ann
        - scanvi_label
        - assay
        - dataset
        - study
        - donor_id
        - subject_ID
        - sample
        - fresh_or_frozen
        - sex
        - lung_condition
        - reference_genome
        - sequencing_platform
        - smoking_status
        - subject_type
        - tissue_dissociation_protocol
        - doubletdetection_score
        - scrublet_score
      scautoqc_metrics_params: configs/qc/scautoqc_params.tsv
      scautoqc_gaussian_kwargs:
        threshold: 0.1
      scautoqc_metrics:
        - n_counts
        - n_genes
        - percent_mito
        - percent_ribo
        - percent_hb
        - scrublet_score
      # thresholds_file: configs/hlca/qc_thresholds.tsv

    merge:
      merge_strategy: inner
      slots:
          X: X
          obs: obs
          var: var
      dask: true
      backed: true
      threads: 50


  HLCA_qc_de:
    input:
      preprocessing:
        qc: data/pipeline/qc/merge/dataset~HLCA_qc.zarr
      split_data: preprocessing
      marker_genes: split_data

    preprocessing:
      raw_counts: X
      normalize:
        target_sum: 10_000
      assemble:
        - normalize

    split_data:
      key: manual_ann
      values:
        - Arterial_EC
        - Macrophages
        - Innate_Lymphoid_Cell_NK
        - AT2
        - Basal
        - Venous_EC
        - T_cell_lineage
        - Fibroblast_lineage
        - Doublets
        - AT1
        - Secretory
        - Ciliated
        - Plasma_cells
        - Smooth_muscle
        - Monocytes
        - SMG_Serous
        - Capillary_EC
        - Lymphatic_EC
        - Neuroendocrine
        - Dendritic_cells
        - B_cells
        - Mast_cells
        - SMG_Mucous
        - SMG_Duct
        - Mesothelium
        - Ionocytes
        - Deuterosomal
        - Brush_Cell_Tuft
        - Poor_QC
        - RBC_doublets

    marker_genes:
      layer: X
      sample: subject_ID
      groups: qc_status
      marker_genes: HLCA_immune, HLCA_epithelial, HLCA_endothelial, HLCA_stroma, HLCA_other
      rank_genes_groups:
        reference: rest
        method: wilcoxon
      plot:
        n_genes: 10


  HCA_integration_all:
    input:
      preprocessing:
        all: data/pipeline/qc/merge/dataset~HLCA_qc.zarr
      integration: preprocessing
      filter: integration
      metrics: filter
      clustering: filter
      label_transfer: clustering
      marker_genes: label_transfer
      collect: marker_genes
    
    clustering:
      recompute_neighbors: true
      recompute_umap: true


  HCA_integration_filtered:
    input:
      filter:
        qc: data/pipeline/qc/merge/dataset~HLCA_qc.zarr
      preprocessing: filter
      integration: preprocessing
      metrics: integration
      clustering: integration
      label_transfer: clustering
      marker_genes: label_transfer
      collect: marker_genes


defaults:

  filter:
    subset: true
    remove_by_column:
      qc_status:
        - failed

  preprocessing:
    raw_counts: X
    normalize:
      target_sum: 10_000
    highly_variable_genes:
      n_top_genes: 2000
      batch_key: dataset
      dask: false
    assemble:
      - normalize
      - highly_variable_genes
    colors:
      - assay
      - dataset
      - study
      - ann_level_1
      - ann_level_2
      - ann_level_3
      - original_ann_level_1
      - original_ann_level_2
      - original_ann_level_3
      - ann_finest_level
      - manual_ann
      - scanvi_label
      - majority_reference
      - qc_status
      - lung_condition
      - sex
      - scrublet_score
      - n_genes
      - n_counts
      - percent_mito
  
  integration:
    batch: dataset
    label: scanvi_label
    raw_counts: layers/counts
    norm_counts: layers/normcounts
    var_mask:
      - highly_variable
    neighbors:
      n_neighbors: 100
    output_types:
      - embed
    umap_colors:
      - assay
      - dataset
      - study
      - ann_level_1
      - ann_level_2
      - ann_level_3
      - original_ann_level_1
      - original_ann_level_2
      - original_ann_level_3
      - ann_finest_level
      - manual_ann
      - scanvi_label
      - majority_reference
      - qc_status
      - lung_condition
      - sex
      - scrublet_score
      - n_genes
      - n_counts
      - percent_mito
    methods:
      unintegrated:
      harmony_pytorch:
        n_comps: 50
        scale: false
      scvi:
        n_layers: 2
        n_latent: 30
        encode_covariates: True
        deeply_inject_covariates: False
        use_layer_norm: both
        use_batch_norm: none
        gene_likelihood: nb
        max_epochs: 100
        early_stopping: true
      scanvi:
        n_layers: 2
        n_latent: 30
        encode_covariates: True
        deeply_inject_covariates: False
        use_layer_norm: both
        use_batch_norm: none
        gene_likelihood: nb
        max_epochs: 100
        early_stopping: true

  clustering:
    algorithm: leiden
    use_gpu: false
    neighbors:
      use_rep: X_emb
      n_neighbors: 100
      metric: euclidean
    resolutions:
      - 0.5
    hierarchy:
      2: 0.2
      3: 0.5
    umap_colors:
      - assay
      - dataset
      - study
      - ann_level_1
      - ann_level_2
      - ann_level_3
      - original_ann_level_1
      - original_ann_level_2
      - original_ann_level_3
      - ann_finest_level
      - manual_ann
      - scanvi_label
      - majority_reference
      - qc_status
      - lung_condition
      - sex
      - scrublet_score
      - n_genes
      - n_counts
      - percent_mito

  metrics:
    unintegrated: layers/normcounts
    raw_counts: layers/counts
    var_mask: highly_variable
    # overwrite_file_id: true
    weight_batch: 0.4
    label: scanvi_label
    batch:
      - dataset
      # - assay
    gene_sets:
      Immune:
        - CD53
        - PTPRC
        - CORO1A
      Alveolar Mph:
        - CYP27A1
        - MARCO
        - FABP4
      T reg:
        - FOXP3
        - RTKN2
      Epithelial:
        - FXYD3
        - EPCAM
        - ELF3
      pre-TB secretory:
        - SCGB1A1 # from Tata paper
        - SFTPB
        - SCGB3A2
        - RNASE1
        - SFTA1P
      AT0:
        - SFTPB
        - SCGB3A2
        - IGFBP2
        - SERPINF1
        - TSPAN1
        - SFTA2
        - C11orf96
      EC:
        - CLDN5
        - ECSCR
        - CLEC14A
      Stroma:
        - COL1A2
        - DCN
        - MFAP4
      Hematopoietic stem cells:
        - CD53
        - PTPRC
        - CORO1A
        - CRHBP
        - SERPINE2
        - MAP7
    metrics:
      - nmi
      - ari
      # - asw_label
      # - asw_batch
      - cell_cycle
      - clisi
      - ilisi
      - graph_connectivity
      - isolated_label_f1
      - pcr_comparison
      - morans_i_genes
      # - pcr
      # - pcr_genes
      - kbet_pg
  
  marker_genes:
    sample: subject_ID
    groups:
      - majority_reference
      - manual_ann
      - leiden_0.5_2
    marker_genes: HLCA_immune, HLCA_epithelial, HLCA_endothelial, HLCA_stroma, HLCA_other
    rank_genes_groups:
      reference: rest
      method: wilcoxon
    plot:
      n_genes: 10
    layer: layers/normcounts

  label_transfer:
    majority_reference:
      reference_key: manual_ann
      query_key: leiden_0.5_3
      crosstab_kwargs:
        dropna: true

  collect:
    sep: --
    same_slots:
      - X
      - var
      - layers
    merge_slots:
      - obs
      - obsm
      - obsp
      - uns
    skip_slots:
      - raw
