DATASETS:

  follow_up_immune:
    input:
      filter: 
        HLCAv1: data/pipeline/HLCAv1/QC/majority_voting/dataset~HLCAv1_extended/file_id~collect:HLCAv1_extended.zarr
      relabel: filter
      qc: relabel
      marker_genes: relabel
    
    filter:
      keep_by_column:
        study:
          - Meyer_2021
    
    relabel:
      selective_update:
        base_column: study
        new_column: low_qc_cluster
        update_map:
          leiden_0.5_3--label_transfer:clustering:highQC:
            "29_1_3": "lowQC_cluster"

    qc:
      counts: layers/counts
      hue:
        - ann_finest_level
        - low_qc_cluster
        - assay
        - dataset
        - donor_id
        - sample
        - fresh_or_frozen
        - sex
        - sequencing_platform
        - scrublet_score
      scautoqc_metrics:
        - n_counts
        - n_genes
        - percent_mito
        - scrublet_score

    marker_genes:
      groups:
        - ann_finest_level
        - low_qc_cluster
        - leiden_0.5_3--label_transfer:clustering:highQC

