DATASETS:
  
  HICA_predict_lineage:
    input:
      preprocessing:
        AIDA: data/input/hca_out/load_data/merged/study/AIDA.zarr
        Ahern2022: data/input/hca_out/load_data/merged/study/Ahern2022.zarr
        Hao2021: data/input/hca_out/load_data/merged/study/Hao2021.zarr
        Lee2020: data/input/hca_out/load_data/merged/study/Lee2020.zarr
        Perez2022: data/input/hca_out/load_data/merged/study/Perez2022.zarr
        Schulte2020: data/input/hca_out/load_data/merged/study/SchulteSchrepping2020.zarr
        Stephenson2021: data/input/hca_out/load_data/merged/study/Stephenson2021.zarr
        VentoTormo: data/input/hca_out/load_data/merged/study/VentoTormo.zarr
        Yazar2022: data/input/hca_out/load_data/merged/study/Yazar2022.zarr
        Yoshida2022: data/input/hca_out/load_data/merged/study/Yoshida2022.zarr
        Liu2021: data/input/hca_out/load_data/merged/study/Liu2021.zarr
        vanderWijst2021: data/input/hca_out/load_data/merged/study/vanderWijst2021.zarr
      clustering: preprocessing
      celltype_prediction: clustering
      relabel: celltype_prediction
      merge: relabel
      split_data: merge

    preprocessing:
      assemble:
        - normalize
        - highly_variable_genes
        - pca
        - neighbors
        - umap
      colors:
        - assay
        - batch
        - pool
        - study
        - author_annotation
        - disease
        - sex
    
    clustering:
      use_gpu: false
      resolutions: 0.8
      hierarchy: 3
      algorithm: leiden
    
    celltype_prediction:
      reference_label: author_annotation
      norm_counts: layers/normcounts
      celltypist:
        params:
          majority_voting: true
          over_clustering: leiden_0.8_3
        models:
          - Healthy_COVID19_PBMC
          - COVID19_HumanChallenge_Blood
    
    relabel:
      new_columns:
        file: configs/celltypist_Healthy_COVID19_PBMC_lineage.tsv
        order:
          # - celltypist_COVID19_HumanChallenge_Blood:majority_voting
          - celltypist_Healthy_COVID19_PBMC:majority_voting
          - lineage
    
    merge:
      slots:
        X: layers/counts
        obs: obs
        var: var
      dask: true 
      backed: true
      threads: 100


  HICA_per_lineage:
    input:
      preprocessing:
        B_cells: "data/pipeline/feature_selection/HICA/split_data/dataset~HICA_predict_lineage/file_id~merge:HICA_predict_lineage/\
          key~lineage/value~B_cells.zarr"
        Myeloid: "data/pipeline/feature_selection/HICA/split_data/dataset~HICA_predict_lineage/file_id~merge:HICA_predict_lineage/\
          key~lineage/value~Myeloid.zarr"
        Other: "data/pipeline/feature_selection/HICA/split_data/dataset~HICA_predict_lineage/file_id~merge:HICA_predict_lineage/\
          key~lineage/value~Other.zarr"
        TCD4_cells: "data/pipeline/feature_selection/HICA/split_data/dataset~HICA_predict_lineage/file_id~merge:HICA_predict_lineage/\
          key~lineage/value~TCD4_cells.zarr"
        TCD8_NK_cells: "data/pipeline/feature_selection/HICA/split_data/dataset~HICA_predict_lineage/file_id~merge:HICA_predict_lineage/\
          key~lineage/value~TCD8_NK_cells.zarr"
      integration: preprocessing
      clustering: integration
      label_transfer: clustering
    
    clustering:
      resolutions: 1.0
      hierarchy:
        2: 0.3
        3: 0.2
    
    label_transfer:
      majority_reference:
        reference_key: celltypist_Healthy_COVID19_PBMC:majority_voting
        query_key: leiden_1.0_3
        crosstab_kwargs:
          dropna: true


  HICA_global:
    input:
      preprocessing:
        All: data/pipeline/feature_selection/HICA/merge/dataset~HICA_predict_lineage.zarr
      integration: preprocessing
      metrics: integration
      clustering: integration
      label_transfer: clustering
      split_data: label_transfer
      collect: label_transfer
      majority_voting: collect
    
    clustering:
      recompute_umap: true
      recompute_neighbors: true
      resolutions: 1.0
      hierarchy:
        2: 0.5
        3: 0.2
    
    label_transfer:
      majority_reference:
        reference_key: celltypist_Healthy_COVID19_PBMC:majority_voting
        query_key: leiden_1.0_3
        crosstab_kwargs:
          dropna: true
    
    majority_voting:
      columns:
        - majority_reference--.*


  HICA_B_collect:
    input:
      metrics:
         # unintegrated
          integration=unintegrated--strategy=lineage: "data/pipeline/feature_selection/HICA/clustering/dataset~HICA_per_lineage/\
            file_id~integration:preprocessing:B_cells--integration=a13194f661.zarr"
          integration=unintegrated--strategy=global: "data/pipeline/feature_selection/HICA/split_data/dataset~HICA_global/\
            file_id~label_transfer:clustering:integration:preprocessing:All--integration=a13194f661/key~lineage/value~B_cells.zarr"
          # harmony
          integration=harmony_scaled--strategy=lineage: "data/pipeline/feature_selection/HICA/clustering/dataset~HICA_per_lineage/\
            file_id~integration:preprocessing:B_cells--integration=244c527d9e.zarr"
          integration=harmony_scaled--strategy=global: "data/pipeline/feature_selection/HICA/split_data/dataset~HICA_global/\
            file_id~label_transfer:clustering:integration:preprocessing:All--integration=244c527d9e/key~lineage/value~B_cells.zarr"
          integration=harmony_unscaled--strategy=lineage: "data/pipeline/feature_selection/HICA/clustering/dataset~HICA_per_lineage/\
            file_id~integration:preprocessing:B_cells--integration=2c75ca29de.zarr"
          integration=harmony_unscaled--strategy=global: "data/pipeline/feature_selection/HICA/split_data/dataset~HICA_global/\
            file_id~label_transfer:clustering:integration:preprocessing:All--integration=2c75ca29de/key~lineage/value~B_cells.zarr"
          # scvi
          integration=scvi_30--strategy=lineage: "data/pipeline/feature_selection/HICA/clustering/dataset~HICA_per_lineage/\
            file_id~integration:preprocessing:B_cells--integration=c3388d9dea.zarr"
          integration=scvi_30--strategy=global: "data/pipeline/feature_selection/HICA/split_data/dataset~HICA_global/\
            file_id~label_transfer:clustering:integration:preprocessing:All--integration=c3388d9dea/key~lineage/value~B_cells.zarr"
          integration=scvi_128--strategy=lineage: "data/pipeline/feature_selection/HICA/clustering/dataset~HICA_per_lineage/\
            file_id~integration:preprocessing:B_cells--integration=0dc489f4a5.zarr"
          integration=scvi_128--strategy=global: "data/pipeline/feature_selection/HICA/split_data/dataset~HICA_global/\
            file_id~label_transfer:clustering:integration:preprocessing:All--integration=0dc489f4a5/key~lineage/value~B_cells.zarr"
          # drvi
          integration=drvi--strategy=lineage: "data/pipeline/feature_selection/HICA/clustering/dataset~HICA_per_lineage/\
            file_id~integration:preprocessing:B_cells--integration=8549126649.zarr"
          integration=drvi--strategy=global: "data/pipeline/feature_selection/HICA/split_data/dataset~HICA_global/\
            file_id~label_transfer:clustering:integration:preprocessing:All--integration=8549126649/key~lineage/value~B_cells.zarr"
          # scpoli
          integration=scpoli--strategy=lineage: "data/pipeline/feature_selection/HICA/clustering/dataset~HICA_per_lineage/\
            file_id~integration:preprocessing:B_cells--integration=8f942f4628.zarr"
          integration=scpoli--strategy=global: "data/pipeline/feature_selection/HICA/split_data/dataset~HICA_global/\
            file_id~label_transfer:clustering:integration:preprocessing:All--integration=8f942f4628/key~lineage/value~B_cells.zarr"
      marker_genes: metrics
      collect: marker_genes
      majority_voting: collect
    metrics:
      gene_sets: B
    majority_voting:
      columns:
        - majority_reference--.*
