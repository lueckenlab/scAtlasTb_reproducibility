DATASETS:
  
  PREPARE_DATA:
    input:
      relabel:
        # scRNA: data/pipeline/load_data/download/Retina_scRNA.h5ad
        snRNA: data/pipeline/load_data/download/Retina_snRNA.h5ad
      doublets: relabel
      qc: doublets
      merge: qc
      split_data: merge
    
    relabel:
      rename_columns:
        sample_uuid: sample_id
        library_uuid: library_id
        suspension_uuid: suspension_id
      rename_obsm_keys:
        X_scVI: X_emb
      new_columns:
        file:  data/output/HRCA/ann_finest_level.tsv
        index_col: index
        order:
          - index
          - ann_finest_level

    doublets:
      counts: raw/X
      batch: suspension_id
      chunk_size: 50_000
      use_gpu: false

    qc:
      counts: raw/X
      plot_params:
        max_groups: 150
      hue:
        - study_name
        - donor_id
        - donor_living_at_sample_collection
        - tissue_type
        - tissue_handling_interval
        - sample_preservation_method
        - suspension_derivation_process
        - suspension_dissociation_reagent
        - suspension_enriched_cell_types
        - suspension_enrichment_factors
        - suspension_id
        - suspension_type
        - sequencing_platform
        # - author_cell_type
        - majorclass
        # - nCount_RNA
        # - nFeature_RNA
        - percent.mt
        - cell_type
        # - assay
        - tissue


  INTEGRATION_GLOBAL:
    input:
      preprocessing:
        HRCA: data/pipeline/HRCA/merge/dataset~PREPARE_DATA.zarr
      integration: preprocessing
      reference_mapping: preprocessing
      split_data: integration, reference_mapping
      clustering: split_data
      label_transfer: clustering
    
    reference_mapping:
      scimilarity:
        model: data/input/scimilarity/model_v1.1
        layer: layers/counts
        var_key: feature_name
      umap_colors:
        - donor_id
        # - donor_age
        - age
        - donor_cause_of_death
        - tissue_source
        - suspension_derivation_process
        - tissue_handling_interval
        - institute
        - library_id_repository
        - sequencing_platform
        - is_primary_data
        - author_cell_type
        - majorclass
        - AC_subclass
        - AC_cluster
        - AC_celltype_number
        - BC_subclass
        - RGC_cluster
        - RGC_celltype_number
        - study_name
        - cell_type
        - sex
        - tissue
        # - self_reported_ethnicity
        - development_stage
        - n_genes
        - n_counts
        - percent_mito
        - scrublet_score

    clustering:
      recompute_umap: true
      recompute_neighbors: true

  INTEGRATION_LINEAGE:
    input:
      preprocessing:
        AC: data/pipeline/HRCA/split_data/dataset~PREPARE_DATA/file_id~merge:PREPARE_DATA/key~majorclass/value~AC.zarr
        BC: data/pipeline/HRCA/split_data/dataset~PREPARE_DATA/file_id~merge:PREPARE_DATA/key~majorclass/value~BC.zarr
        RGC: data/pipeline/HRCA/split_data/dataset~PREPARE_DATA/file_id~merge:PREPARE_DATA/key~majorclass/value~RGC.zarr
      integration: preprocessing
      clustering: integration
      label_transfer: clustering

    clustering:
      umap_colors:
        - ann_finest_level
        - sample_id


